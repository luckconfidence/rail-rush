<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070B18" />
    <link rel="icon" href="data:," />
    <title>铁轨狂奔 · Rail Rush</title>
    <script type="module" crossorigin src="./assets/index-CVFE9VD3.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DaOFnLbk.css">
  </head>
  <body>
<p data-aigc-mark="1" style="margin:0 0 8px;font-size:10px;line-height:1.3;color:#6b6560;font-weight:400;">AI生成</p>

    <main id="app">
      <canvas id="game-canvas" aria-label="铁轨狂奔游戏画布"></canvas>

      <div class="vignette" aria-hidden="true"></div>

      <section id="hud" data-mode="title" aria-live="polite">
        <div class="hud-top">
          <div class="hud-chip score">
            <span class="chip-icon">★</span>
            <div>
              <span class="label">分数</span>
              <strong id="score-value">0</strong>
            </div>
          </div>
          <div class="hud-chip coins">
            <span class="chip-icon coin-icon">●</span>
            <div>
              <span class="label">金币</span>
              <strong id="coin-value">0</strong>
            </div>
          </div>
          <div class="hud-chip">
            <span class="chip-icon">⚡</span>
            <div>
              <span class="label">距离</span>
              <strong id="distance-value">0m</strong>
            </div>
          </div>
          <div class="hud-chip best">
            <span class="chip-icon">♛</span>
            <div>
              <span class="label">最佳</span>
              <strong id="best-value">0</strong>
            </div>
          </div>
          <button id="btn-pause" type="button" class="icon-btn" aria-label="暂停">
            <span class="pause-bars"></span>
          </button>
        </div>
        <div id="power-list" class="power-list"></div>
      </section>

      <div id="toast" role="status"></div>

      <section id="title-screen" class="overlay">
        <div class="overlay-glow" aria-hidden="true"></div>
        <div class="panel hero">
          <div class="logo-row">
            <span class="logo-badge">RAIL</span>
            <span class="logo-badge accent">RUSH</span>
          </div>
          <h1 class="game-title">
            <span class="title-line">铁轨</span>
            <span class="title-line glow">狂奔</span>
          </h1>
          <p class="tagline">冲进霓虹夜轨，换道、跳跃、翻滚，把金币和最高分一起带走。</p>
          <div class="controls-grid">
            <div class="control-card">
              <div class="keys"><kbd>A</kbd><kbd>D</kbd></div>
              <span>换道</span>
            </div>
            <div class="control-card">
              <div class="keys"><kbd>W</kbd><kbd>␣</kbd></div>
              <span>跳跃</span>
            </div>
            <div class="control-card">
              <div class="keys"><kbd>S</kbd></div>
              <span>滑铲</span>
            </div>
            <div class="control-card">
              <div class="keys"><kbd>📱</kbd></div>
              <span>滑动/按钮</span>
            </div>
          </div>
          <button id="btn-start" type="button" class="primary">
            <span class="btn-shine"></span>
            开始奔跑
          </button>
          <p class="foot-note">原创夜城跑酷 · 非商业 IP 复刻</p>
        </div>
      </section>

      <section id="pause-screen" class="overlay" hidden>
        <div class="overlay-glow" aria-hidden="true"></div>
        <div class="panel compact">
          <div class="icon-circle">❚❚</div>
          <h2>已暂停</h2>
          <p class="muted">喘口气，随时继续冲刺。</p>
          <button id="btn-resume" type="button" class="primary">
            <span class="btn-shine"></span>
            继续奔跑
          </button>
        </div>
      </section>

      <section id="gameover-screen" class="overlay" hidden>
        <div class="overlay-glow" aria-hidden="true"></div>
        <div class="panel compact">
          <div class="icon-circle danger">×</div>
          <p class="eyebrow">本轮结束</p>
          <h2>再跑一次？</h2>
          <div class="results">
            <div class="result-card">
              <span>分数</span>
              <strong id="final-score">0</strong>
            </div>
            <div class="result-card">
              <span>金币</span>
              <strong id="final-coins">0</strong>
            </div>
            <div class="result-card">
              <span>距离</span>
              <strong id="final-distance">0m</strong>
            </div>
            <div class="result-card highlight">
              <span>最佳</span>
              <strong id="final-best">0</strong>
            </div>
          </div>
          <button id="btn-restart" type="button" class="primary">
            <span class="btn-shine"></span>
            重新开始
          </button>
        </div>
      </section>

      <div id="touch-controls" aria-hidden="true">
        <button id="btn-left" type="button" class="touch-btn">◀</button>
        <button id="btn-roll" type="button" class="touch-btn">滑铲</button>
        <button id="btn-jump" type="button" class="touch-btn primary-touch">跳跃</button>
        <button id="btn-right" type="button" class="touch-btn">▶</button>
      </div>
    </main>
  </body>
</html>
