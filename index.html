<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1220" />
    <link rel="icon" href="data:," />
    <title>Rail Rush · 铁轨狂奔</title>
    <script type="module" crossorigin src="./assets/index-CgFZSr3I.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D5t2SIOd.css">
  </head>
  <body>
<p data-aigc-mark="1" style="margin:0 0 8px;font-size:10px;line-height:1.3;color:#6b6560;font-weight:400;">AI生成</p>

    <main id="app">
      <canvas id="game-canvas" aria-label="Rail Rush 游戏画布"></canvas>

      <section id="hud" data-mode="title" aria-live="polite">
        <div class="hud-top">
          <div class="hud-block">
            <span class="label">分数</span>
            <strong id="score-value">0</strong>
          </div>
          <div class="hud-block coins">
            <span class="label">金币</span>
            <strong id="coin-value">0</strong>
          </div>
          <div class="hud-block">
            <span class="label">距离</span>
            <strong id="distance-value">0m</strong>
          </div>
          <div class="hud-block">
            <span class="label">最佳</span>
            <strong id="best-value">0</strong>
          </div>
          <button id="btn-pause" type="button" class="icon-btn" aria-label="暂停">❚❚</button>
        </div>
        <div id="power-list" class="power-list"></div>
      </section>

      <div id="toast" role="status"></div>

      <section id="title-screen" class="overlay">
        <div class="panel hero">
          <p class="eyebrow">原创三道跑酷</p>
          <h1>铁轨狂奔</h1>
          <p class="tagline">换道、跳跃、翻滚，收集金币与道具，在夜色都市铁轨上冲出最高分。</p>
          <ul class="controls-hint">
            <li><kbd>A</kbd><kbd>D</kbd> / <kbd>←</kbd><kbd>→</kbd> 换道</li>
            <li><kbd>W</kbd> / <kbd>空格</kbd> 跳跃</li>
            <li><kbd>S</kbd> / <kbd>↓</kbd> 翻滚</li>
            <li>手机：滑动或点按按钮</li>
          </ul>
          <button id="btn-start" type="button" class="primary">开始奔跑</button>
        </div>
      </section>

      <section id="pause-screen" class="overlay" hidden>
        <div class="panel">
          <h2>已暂停</h2>
          <button id="btn-resume" type="button" class="primary">继续</button>
        </div>
      </section>

      <section id="gameover-screen" class="overlay" hidden>
        <div class="panel">
          <p class="eyebrow">本轮结束</p>
          <h2>再跑一次？</h2>
          <div class="results">
            <div><span>分数</span><strong id="final-score">0</strong></div>
            <div><span>金币</span><strong id="final-coins">0</strong></div>
            <div><span>距离</span><strong id="final-distance">0m</strong></div>
            <div><span>最佳</span><strong id="final-best">0</strong></div>
          </div>
          <button id="btn-restart" type="button" class="primary">重新开始</button>
        </div>
      </section>

      <div id="touch-controls" aria-hidden="true">
        <button id="btn-left" type="button" class="touch-btn">◀</button>
        <button id="btn-roll" type="button" class="touch-btn">滑铲</button>
        <button id="btn-jump" type="button" class="touch-btn primary-touch">跳跃</button>
        <button id="btn-right" type="button" class="touch-btn">▶</button>
      </div>
    </main>
  </body>
</html>
